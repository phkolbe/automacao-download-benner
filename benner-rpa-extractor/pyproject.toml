[project]
name = "benner-rpa-extractor"
version = "0.1.0"
description = "Robô de extração de documentos do Benner — Fase 1, somente leitura"
requires-python = ">=3.11,<3.12"
dependencies = [
    "playwright>=1.40",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benner_rpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gate: teste de gate — veto absoluto, nunca skip/xfail (GATES.md)",
    "rede: exige acesso real ao Benner — bloqueado por G10 sem autorização",
]
addopts = "-q --strict-markers"
